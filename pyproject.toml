[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-media-downloader"
version = "0.2.0"
description = "Headless daemon tailing Telegram channels and saving media"
authors = [{ name = "dmitry" }]
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.34.0",
    "aiofiles>=23.2.0",
    "prometheus-client>=0.19.0",
]

[project.scripts]
tg-media-downloader = "tg_media_downloader.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
